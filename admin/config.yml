backend:
  name: github
  repo: suvarnajewellers/suvarnajewellers.github.io
  branch: main

media_folder: "images/products"
public_folder: "/images/products"

collections:
  - name: "products"
    label: "Products"
    file: "products.json"
    fields:

      - label: "Products"
        name: "products"
        widget: "list"

        fields:

          - label: "ID"
            name: "id"
            widget: "number"

          - label: "Category"
            name: "category"
            widget: "select"
            options:
              - Gold Jewellery
              - Silver Jewellery

          - label: "Sub Category"
            name: "subCategory"
            widget: "select"
            options:
              - Ring
              - Pendant
              - Bracelet
              - Chain
              - Earrings
              - Rudraksha Mala
              - Rudraksha Bracelet
              - Tulsi Mala
              - Articles
              - Custom Designs

          - label: "Ready Stock"
            name: "isReadyStock"
            widget: "boolean"
            default: false

          - label: "Product Name"
            name: "name"
            widget: "string"

          - label: "Product Code"
            name: "code"
            widget: "string"

          - label: "Metal"
            name: "metal"
            widget: "string"

          - label: "Gross Weight"
            name: "grossWeight"
            widget: "string"

          - label: "Net Weight"
            name: "netWeight"
            widget: "string"

          - label: "Size"
            name: "size"
            widget: "string"

          - label: "Image"
            name: "image"
            widget: "image"

          - label: "Description"
            name: "description"
            widget: "text"

          - label: "Ready Stock"
  name: "isReadyStock"
  widget: "boolean"
  default: false
  required: false

          - label: "Tags"
            name: "tags"
            widget: "list"

          - label: "WhatsApp"
            name: "whatsapp"
            widget: "string"
